<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — Ansaff Ashraff</title>
  <meta name="description" content="Travel and landscape photography by Ansaff Ashraff. Caves, highlands, and cold light." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="brand">Ansaff Ashraff<span class="dot">.</span></a>
    <nav class="nav" aria-label="Primary">
      <a href="portfolio.html" class="is-current">Portfolio</a>
      <a href="about.html">About</a>
      <a href="blog.html">Blog</a>
      <a href="work.html">Work With Me</a>
    </nav>
  </header>
  <div class="topbar-rule"><hr /></div>

  <main class="grid" id="grid"></main>

  <footer class="site-foot">
    <span>&copy; <span id="year"></span> Ansaff Ashraff</span>
    <div class="socials">
      <!-- Replace the # with your real profile URLs -->
      <a href="#" aria-label="Instagram" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="#" aria-label="Email" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      </a>
    </div>
  </footer>

  <!-- lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true" tabindex="-1" aria-label="Photo viewer">
    <div class="lb-stage">
      <button class="lb-btn" id="lb-close" aria-label="Close viewer">&times;</button>
      <button class="lb-btn" id="lb-prev" aria-label="Previous photo">&#8249;</button>
      <img id="lb-img" src="" alt="" />
      <button class="lb-btn" id="lb-next" aria-label="Next photo">&#8250;</button>
      <div class="lb-meta"><span id="lb-frame"></span><span id="lb-place"></span></div>
    </div>
  </div>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
  <script src="js/photos.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
