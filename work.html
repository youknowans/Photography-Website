<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work With Me — Ansaff Ashraff</title>
  <meta name="description" content="Commission Ansaff Ashraff for travel and landscape photography." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="brand">Ansaff Ashraff<span class="dot">.</span></a>
    <nav class="nav" aria-label="Primary">
      <a href="portfolio.html">Portfolio</a>
      <a href="about.html">About</a>
      <a href="blog.html">Blog</a>
      <a href="work.html" class="is-current">Work With Me</a>
    </nav>
  </header>
  <div class="topbar-rule"><hr /></div>

  <div class="page-head">
    <div class="eyebrow">Work With Me</div>
    <h1>Tell me about the project</h1>
  </div>

  <div class="prose" style="padding-bottom:8px;">
    <p class="lead">Prints, commissions, collaborations, or something I haven't thought of yet — fill in the brief below and it'll open in your email app, ready to send.</p>
  </div>

  <div class="form-wrap">
    <div class="field">
      <label for="name">Your name</label>
      <input type="text" id="name" />
    </div>
    <div class="field">
      <label for="from">Your email</label>
      <input type="email" id="from" placeholder="so I can reply" />
    </div>
    <div class="field">
      <label for="type">What kind of work?</label>
      <select id="type">
        <option>Print purchase</option>
        <option>Commission / shoot</option>
        <option>Collaboration</option>
        <option>Something else</option>
      </select>
    </div>
    <div class="field">
      <label for="brief">The brief</label>
      <textarea id="brief" placeholder="Where, when, the vibe you're after, budget if you have one in mind..."></textarea>
    </div>
    <button class="btn" id="send">Open in email</button>
  </div>

  <footer class="site-foot">
    <span>&copy; <span id="year"></span> Ansaff Ashraff</span>
    <div class="socials">
      <a href="#" aria-label="Instagram" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="#" aria-label="Email" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      </a>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    // ---- mailto contact: change this address to your real email ----
    var MY_EMAIL = "hello@youknowans.com";
    document.getElementById("send").addEventListener("click", function () {
      var name = document.getElementById("name").value || "(no name)";
      var from = document.getElementById("from").value || "(no email given)";
      var type = document.getElementById("type").value;
      var brief = document.getElementById("brief").value || "(no brief)";
      var subject = "Work enquiry: " + type + " — " + name;
      var body =
        "Name: " + name + "\n" +
        "Email: " + from + "\n" +
        "Type: " + type + "\n\n" +
        "Brief:\n" + brief;
      window.location.href = "mailto:" + MY_EMAIL +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(body);
    });
  </script>
</body>
</html>
